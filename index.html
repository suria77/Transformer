<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transmuta · Conversor y compresor</title>
<meta name="description" content="Convierte y comprime audio, vídeo, imágenes y PDF directamente en tu dispositivo. Tus archivos no se suben a ningún servidor.">
<meta name="theme-color" content="#1d1e21">
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Transmuta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Concepto: consola de estudio. Gris grafito con paneles biselados, interruptores tipo transporte,
   azul de selección y LEDs verdes. Letra clara y grande para que se lea bien. */
:root{
  --bg:#1d1e21; --panel:#2e2f33; --panel2:#38393e; --well:#17181a; --ink:#EEF0F3; --ink2:#AEB3BD;
  --line:#0f1011; --edge:rgba(255,255,255,.07); --edge2:rgba(255,255,255,.14);
  --blue:#3d94ff; --blue2:#1f66d6; --amber:#FFB224; --amber-soft:rgba(255,178,36,.12);
  --ok:#35D07F; --ok-soft:rgba(53,208,127,.12); --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.12);
  --audio:#4AA3FF; --video:#B98BFF; --image:#35D07F; --pdf:#FF7A6B;
  --font-display:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --raise:linear-gradient(180deg,#3d3e43 0%,#2f3034 100%);
  --shadow:0 1px 0 var(--edge) inset,0 12px 28px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;font-family:var(--font-body);font-size:17px;line-height:1.5;color:var(--ink);
  background:radial-gradient(70rem 30rem at 50% -10%,#303136 0%,transparent 65%),var(--bg);
  background-attachment:fixed;min-height:100vh;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;
  background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg,.brand .logo{width:48px;height:48px;flex:none;border-radius:12px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.brand h1{font-size:1.7rem;font-weight:600;letter-spacing:.02em;line-height:1}
.brand p{color:var(--ink2);font-size:.98rem;margin-top:4px}
.priv{display:inline-flex;align-items:center;gap:9px;background:var(--well);color:var(--ok);border:1px solid var(--line);border-radius:999px;padding:8px 15px 8px 12px;font-weight:500;font-size:.95rem;box-shadow:0 1px 0 var(--edge)}
.priv::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);order:-1}
.priv svg{display:none}

/* Pestañas tipo transporte */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--well);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 1px 0 var(--edge)}
.tab{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;background:transparent;padding:14px 10px;border-radius:10px;font-weight:600;font-size:1.05rem;color:var(--ink2);transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,#58a6ff,var(--blue2));border-color:#0e3f8f;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px -8px rgba(61,148,255,.9)}

/* Paneles */
.card{background:var(--raise);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.head{display:flex;flex-direction:column;gap:4px}
.head h2{font-size:1.5rem;font-weight:600}
.head p{color:var(--ink2)}
.back{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 15px;font-weight:600;color:var(--ink2);margin-bottom:10px;box-shadow:0 1px 0 var(--edge) inset}
.back:hover{color:var(--ink)}

/* Zona de carga */
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;cursor:pointer;
  border:2px dashed #5a5c63;border-radius:16px;padding:32px 20px;background:var(--well);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--amber);background:#1d1c18}
.drop .bubble{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#58a6ff,var(--blue2));box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 22px -10px rgba(61,148,255,.9)}
.drop .bubble svg{width:32px;height:32px}
.drop strong{font-size:1.3rem;font-weight:600}
.drop span.sub{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px}
.chip{font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);font-family:var(--mono)}

/* Ajustes */
.settings{display:flex;flex-direction:column;gap:16px}
.settings h3,.bulk h3{font-size:.92rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--well);border-radius:12px;padding:13px 15px;box-shadow:0 1px 0 var(--edge);transition:border-color .15s,background .15s}
.opt b{font-size:1.05rem;font-weight:600}
.opt small{color:var(--ink2);font-size:.92rem;line-height:1.3}
.opt:hover{border-color:#4a4c52}
.opt[aria-pressed="true"]{border-color:var(--blue);background:linear-gradient(180deg,#1b2a41,#162234);box-shadow:0 0 0 1px var(--blue) inset,0 6px 16px -10px rgba(61,148,255,.9)}
.opt[aria-pressed="true"] b{color:#fff}
.row{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:190px;flex:1 1 190px}
.field label,.lbl{font-weight:600;font-size:.98rem}
.field small{color:var(--ink2);font-size:.9rem}
select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--well);color:var(--ink);border-radius:10px;padding:10px 13px;font-size:1.02rem;min-height:48px;box-shadow:0 1px 0 var(--edge)}
select:focus,input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(61,148,255,.25)}
input::placeholder{color:#7d828c}
.check{display:flex;align-items:center;gap:12px;font-weight:500;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--blue)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:#FFD27A;border:1px solid rgba(255,178,36,.28);border-radius:10px;padding:11px 14px;font-size:.96rem}
.note svg{margin-top:2px}

/* Formatos para todos */
.bulk{display:flex;flex-direction:column;gap:14px}
.bulkrow{display:flex;flex-wrap:wrap;gap:8px 8px;align-items:center}
.bulkrow .lbl{min-width:100px;color:var(--ink2)}
.fmt{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 14px;font-weight:600;font-size:.98rem;color:var(--ink2);font-family:var(--mono);box-shadow:0 1px 0 var(--edge) inset}
.fmt:hover{color:var(--ink)}
.fmt.on{color:#fff;background:linear-gradient(180deg,#58a6ff,var(--blue2));border-color:#0e3f8f}
.sep{color:var(--ink2);font-size:.92rem;padding:0 6px}

/* Pistas (archivos) */
.jobs{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;background:var(--well);border:1px solid var(--line);box-shadow:0 1px 0 var(--edge)}
.tile svg{width:26px;height:26px}
.k-audio{color:var(--audio)} .k-video{color:var(--video)} .k-image{color:var(--image)} .k-pdf{color:var(--pdf)}
.jinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.jname{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.jmeta{color:var(--ink2);font-size:.95rem;font-family:var(--mono)}
.jctl{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:10px 14px;align-items:center;justify-content:space-between}
.jctl .left{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jctl select{width:auto;min-width:0;flex:1 1 150px;max-width:260px;padding:9px 12px;min-height:46px}
.icon-btn{display:inline-grid;place-items:center;width:46px;height:46px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);box-shadow:0 1px 0 var(--edge) inset}
.icon-btn:hover{color:var(--bad)}
.icon-btn.neutral:hover{color:var(--blue)}
.icon-btn:disabled{opacity:.3;cursor:default}
.jstat{grid-column:1/-1}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-radius:10px;padding:11px 14px;background:var(--well);border:1px solid var(--line);font-weight:500}
.status.done{border-color:rgba(53,208,127,.35);background:linear-gradient(180deg,#14221b,#101a15);color:#C9F5DF}
.status.err{border-color:rgba(255,107,107,.4);background:#241415;color:#FFC4C4}
.bar{flex:1 1 180px;height:14px;border-radius:4px;background:#0c0d0e;overflow:hidden;min-width:120px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0%;background:
  repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.55) 6px 8px),
  linear-gradient(90deg,#35D07F,#B7E34A 70%,#FFB224);transition:width .25s}
.pct{font-family:var(--mono);min-width:3.5em;text-align:right}
.saved{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:3px 11px;font-size:.95rem;border:1px solid rgba(53,208,127,.35);font-family:var(--mono)}
.saved.nosave{color:#FFD27A;border-color:rgba(255,178,36,.35);background:var(--amber-soft)}
.results{display:flex;flex-direction:column;gap:8px;width:100%}
.resline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.resline span.nm{overflow-wrap:anywhere;min-width:0;flex:1 1 200px}
.resline svg{color:var(--ok)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:12px 20px;font-weight:600;font-size:1.05rem;min-height:52px;box-shadow:0 1px 0 var(--edge) inset;transition:filter .12s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:#0e3f8f;color:#fff;background:linear-gradient(180deg,#58a6ff,var(--blue2));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 22px -12px rgba(61,148,255,.9)}
.btn.good{border-color:#136b3f;color:#04210f;background:linear-gradient(180deg,#58e39c,#25b865)}
.btn.small{min-height:44px;padding:8px 16px;font-size:.98rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
.link{background:none;border:0;color:var(--ink2);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:8px 6px}
.link:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.actions .grow{flex:1}

/* Herramientas */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tool{display:flex;gap:16px;align-items:flex-start;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:border-color .15s,transform .12s}
.tool:hover{border-color:var(--blue);transform:translateY(-2px)}
.tool .tile{width:54px;height:54px;color:var(--amber)}
.tool h3{font-size:1.15rem;font-weight:600;margin-bottom:3px;text-transform:none;letter-spacing:0;color:var(--ink)}
.tool p{color:var(--ink2);font-size:1rem}

/* Avisos */
.banner{position:sticky;top:max(10px,env(safe-area-inset-top,0px));z-index:5;display:none;align-items:center;gap:12px;background:#000;border:1px solid var(--amber);color:#FFE2A8;border-radius:12px;padding:13px 18px;font-weight:600;box-shadow:0 18px 30px -16px rgba(0,0,0,.9)}
.banner.show{display:flex}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--amber);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#000;border:1px solid var(--edge2);color:#fff;padding:14px 20px;border-radius:12px;max-width:min(92vw,560px);font-weight:500;transition:all .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--ink2);font-size:.95rem;padding:10px 0 4px}

@media (max-width:720px){
  .opts{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .tab{flex-direction:column;gap:4px;padding:10px 4px;font-size:.95rem}
  .brand h1{font-size:1.5rem}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="48" height="48">

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Esta aplicación necesita JavaScript para funcionar.</p></noscript>

<script>
(function(){
'use strict';

/* ───────── Utilidades ───────── */

const fmtTime=s=>{if(!isFinite(s))return '';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let uid=0;
const ICONS={
 upload:'<path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>',
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',

 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',

 up:'<path d="M12 19V5m0 0l-6 6m6-6l6 6"/>',
 down:'<path d="M12 5v14m0 0l-6-6m6 6l6-6"/>',

 mute:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>',
 wave:'<path d="M3 12h2m3-6v12m4-9v6m4-10v14m4-9v4"/>',

 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',

};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
let toastT;

function setBanner(msg){const b=$('#banner');if(msg){$('#bannerMsg').textContent=msg;b.classList.add('show')}else b.classList.remove('show')}

/* ───────── Tipos y formatos ───────── */
const EXT={
 audio:'mp3 wav m4a aac ogg oga opus flac wma aiff aif amr mp2 weba caf'.split(' '),
 video:'mp4 mov mkv avi webm m4v wmv flv 3gp mpg mpeg mts m2ts ogv'.split(' '),

const KIND_LABEL={audio:'Audio',video:'Vídeo',image:'Imagen',pdf:'PDF'};

function audioArgs(fmt,ab){
  switch(fmt){
    case 'mp3':return ['-c:a','libmp3lame','-b:a',ab+'k'];
    case 'm4a':return ['-c:a','aac','-b:a',ab+'k'];
    case 'wav':return ['-c:a','pcm_s16le'];
    case 'flac':return ['-c:a','flac'];
    case 'ogg':return ['-c:a','libvorbis','-b:a',ab+'k'];
    case 'opus':return ['-c:a','libopus','-ar','48000','-b:a',Math.min(ab,192)+'k'];
    case 'aiff':return ['-c:a','pcm_s16be'];
  }
  return [];
}
const EVEN='scale=trunc(iw/2)*2:trunc(ih/2)*2';
function videoArgs(fmt,q){
  switch(fmt){
    case 'mp4':case 'mov':case 'mkv':
      return ['-vf',EVEN,'-c:v','libx264','-preset','veryfast','-crf',String(q.crf),'-pix_fmt','yuv420p','-c:a','aac','-b:a',q.ab+'k'].concat(fmt==='mkv'?[]:['-movflags','+faststart']);
    case 'webm':
      return ['-c:v','libvpx','-deadline','realtime','-cpu-used','5','-crf',String(q.crf-8),'-b:v',q.ab>200?'3M':'1500k','-c:a','libvorbis','-b:a',q.ab+'k'];
    case 'avi':
      return ['-c:v','mpeg4','-q:v',String(q.qv),'-c:a','libmp3lame','-b:a',q.ab+'k'];
    case 'gif':
      return ['-t','15','-vf','fps=12,scale=480:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse','-loop','0','-an'];
  }
  return [];
}

/* ───────── Motor ffmpeg (audio y vídeo) ───────── */
let engine=null,enginePromise=null,currentJob=null;
const logBuf=[];
async function fetchBlobURL(url,mime,onP){
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const total=+res.headers.get('content-length')||0;
  if(!res.body||!onP){const b=await res.blob();return URL.createObjectURL(new Blob([b],{type:mime}))}
  const rd=res.body.getReader(),parts=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onP(total?got/total:Math.min(.97,got/32e6))}
  return URL.createObjectURL(new Blob(parts,{type:mime}));
}
async function startFF(FFmpeg,cfg){
  const ff=new FFmpeg();
  ff.on('log',({message})=>{logBuf.push(message);if(logBuf.length>60)logBuf.shift()});
  ff.on('progress',({progress})=>{if(currentJob&&isFinite(progress))setProgress(currentJob,clamp(progress,0,1))});
  await ff.load(cfg);
  return ff;
}
function loadEngine(){
  if(engine)return Promise.resolve(engine);
  if(enginePromise)return enginePromise;
  enginePromise=(async()=>{
    let last;
    for(const mk of CDN_FF){
      try{
        setBanner('Preparando el motor de audio y vídeo…');
        const {FFmpeg}=await import(mk('@ffmpeg/ffmpeg',FF_VER.ffmpeg,'dist/esm/index.js'));
        const workerSrc=mk('@ffmpeg/ffmpeg',FF_VER.ffmpeg,'dist/esm/worker.js');
        const classWorkerURL=URL.createObjectURL(new Blob(['import '+JSON.stringify(workerSrc)+';'],{type:'text/javascript'}));
        const coreURL=await fetchBlobURL(mk('@ffmpeg/core',FF_VER.core,'dist/esm/ffmpeg-core.js'),'text/javascript');
        const wasmURL=await fetchBlobURL(mk('@ffmpeg/core',FF_VER.core,'dist/esm/ffmpeg-core.wasm'),'application/wasm',
          p=>setBanner('Descargando el motor (solo la primera vez, unos 30 MB)… '+Math.round(clamp(p,0,.99)*100)+' %'));
        const cfg={coreURL,wasmURL,classWorkerURL};
        setBanner('Arrancando el motor…');
        const ff=await startFF(FFmpeg,cfg);
        engine={FFmpeg,cfg,ff};
        setBanner('');
        return engine;
      }catch(e){last=e;console.warn('Motor:',e)}
    }
    throw new Error('No se pudo cargar el motor de audio y vídeo. Comprueba tu conexión a internet e inténtalo de nuevo.');
  })().catch(e=>{enginePromise=null;setBanner('');throw e});
  return enginePromise;
}
async function runFF(job,{files,args,outExt,mime}){
  const eng=await loadEngine();
  if(!eng.ff)eng.ff=await startFF(eng.FFmpeg,eng.cfg);
  const ff=eng.ff;
  logBuf.length=0;currentJob=job;
  const ins=[],out='out.'+outExt;
  try{
    for(let i=0;i<files.length;i++){
      const n='in'+i+'.'+(extOf(files[i].name)||'bin');
      await ff.writeFile(n,new Uint8Array(await files[i].arrayBuffer()));
      ins.push(n);
    }
    const argv=args.map(a=>a==='$out'?out:/^\$\d$/.test(a)?ins[+a[1]]:a);
    const code=await ff.exec(argv);
    if(job.cancelled)throw new Error('cancelado');
    if(code!==0){
      const tail=logBuf.filter(Boolean).slice(-3).join(' · ');
      throw new Error('No se pudo procesar este archivo (puede estar dañado o tener un formato poco habitual).'+(tail?' Detalle: '+tail:''));
    }
    const data=await ff.readFile(out);
    return new Blob([data],{type:mime});
  }finally{
    currentJob=null;
    try{for(const n of ins)await ff.deleteFile(n)}catch(e){}
    try{await ff.deleteFile(out)}catch(e){}
  }
}
function cancelFF(){
  if(engine&&engine.ff){try{engine.ff.terminate()}catch(e){}engine.ff=null}
}

/* ───────── Imágenes (canvas) ───────── */
async function loadBitmap(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file)}catch(e){}
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('Este navegador no puede leer esta imagen. Si es HEIC, ábrela con Safari o conviértela antes.'));img.src=url});
    return img;
  }finally{setTimeout(()=>URL.revokeObjectURL(url),3000)}
}
async function renderImage(file,{mime,quality=.85,maxDim=0}){
  const src=await loadBitmap(file);
  let w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
  if(maxDim&&Math.max(w,h)>maxDim){const k=maxDim/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
  x.imageSmoothingQuality='high';
  x.drawImage(src,0,0,w,h);
  if(src.close)src.close();
  const blob=await new Promise(r=>c.toBlob(r,mime,quality));
  c.width=c.height=0;
  if(!blob||blob.type!==mime)throw new Error('Este navegador no puede crear archivos '+mime.replace('image/','').toUpperCase()+'. Prueba con otro formato.');
  return blob;
}

/* ───────── PDF ───────── */
async function pdfCompress(job,level){
  await needPdfLib();await needPdfJs();
  const data=new Uint8Array(await job.file.arrayBuffer());
  let doc;
  try{doc=await pdfjsLib.getDocument({data}).promise}catch(e){
    if(e&&e.name==='PasswordException')throw new Error('Este PDF está protegido con contraseña.');
    throw new Error('No se pudo abrir el PDF (puede estar dañado).');
  }
  const out=await PDFLib.PDFDocument.create();
  const MAXPX=14e6,n=doc.numPages;
  for(let i=1;i<=n;i++){
    if(job.cancelled)throw new Error('cancelado');
    const page=await doc.getPage(i);
    const v1=page.getViewport({scale:1});
    let sc=level.pdfScale;
    const px=v1.width*v1.height*sc*sc;
    if(px>MAXPX)sc*=Math.sqrt(MAXPX/px);
    const vp=page.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:cx,viewport:vp}).promise;
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',level.pdfQ));
    const bytes=new Uint8Array(await blob.arrayBuffer());
    c.width=c.height=0;page.cleanup();
    const img=await out.embedJpg(bytes);
    const p=out.addPage([v1.width,v1.height]);
    p.drawImage(img,{x:0,y:0,width:v1.width,height:v1.height});
    setProgress(job,i/n);
    await new Promise(r=>setTimeout(r,0));
  }
  try{doc.destroy()}catch(e){}
  const bytes=await out.save({useObjectStreams:true});
  return new Blob([bytes],{type:'application/pdf'});
}
function parseRange(str,n){
  const parts=String(str||'').split(/[,;\s]+/).filter(Boolean);
  if(!parts.length)throw new Error('Escribe qué páginas quieres, por ejemplo: 1-3, 5, 8-10');
  const idx=[];
  for(const p of parts){
    const m=/^(\d+)(?:-(\d+))?$/.exec(p);
    if(!m)throw new Error('Rango no válido: «'+p+'». Ejemplo: 1-3, 5, 8-10');
    const a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b<a||b>n)throw new Error('El rango «'+p+'» no existe: el PDF tiene '+n+' páginas.');
    for(let k=a;k<=b;k++)idx.push(k-1);
  }
  return idx;
}
async function loadPdfDoc(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  try{return await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true})}
  catch(e){throw new Error('No se pudo abrir el PDF «'+file.name+'» (puede estar dañado o protegido).')}
}

/* ───────── Duración de audio/vídeo ───────── */
function getDuration(file,kind){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);
    const el=document.createElement(kind==='audio'?'audio':'video');
    let fin=false;
    const done=v=>{if(fin)return;fin=true;URL.revokeObjectURL(url);el.removeAttribute('src');try{el.load()}catch(e){}res(v)};
    el.preload='metadata';
    el.onloadedmetadata=()=>done(isFinite(el.duration)?el.duration:NaN);
    el.onerror=()=>done(NaN);
    setTimeout(()=>done(NaN),8000);
    el.src=url;
  });
}
function parseTime(s){
  s=String(s||'').trim().replace(',','.');
  if(!s)return null;
  const p=s.split(':');
  if(p.length>3||p.some(x=>x===''||isNaN(+x)))return NaN;
  return p.reduce((a,x)=>a*60+(+x),0);
}

const TOOLS={

  mute:{title:'Quitar el sonido de un vídeo',desc:'Deja el vídeo mudo sin perder calidad de imagen.',icon:'mute',accept:['video'],verb:'Quitar el sonido',multi:true},
  normalize:{title:'Igualar el volumen',desc:'Que todo suene parejo, sin partes muy bajas ni muy fuertes.',icon:'wave',accept:['audio','video'],verb:'Igualar el volumen',multi:true},
  pdfmerge:{title:'Unir PDFs',desc:'Junta varios PDF en uno solo y elige el orden.',icon:'merge',accept:['pdf'],combine:true,verb:'Unir en un solo PDF',multi:true},
  pdfsplit:{title:'Dividir o extraer páginas de un PDF',desc:'Saca las páginas que quieras o separa cada página en su propio archivo.',icon:'split',accept:['pdf'],verb:'Dividir PDF',multi:true},

};
const state={tab:'convert',tool:null};
const mkWS=(id,settings)=>({id,jobs:[],settings,busy:false,stop:false,combo:null});
const WS={
  convert:mkWS('convert',{quality:'mid'}),
  compress:mkWS('compress',{level:'mid',targetMB:'',audioOut:'mp3',imageOut:'jpg'}),
  tool:mkWS('tool',{trimFrom:'0:00',trimTo:'',splitMode:'range',range:'',pageMode:'a4',shrink:true})
};
const curWS=()=>WS[state.tab];
const toolDef=()=>state.tool?TOOLS[state.tool]:null;
function acceptsKind(ws,k){
  if(ws.id==='convert')return k==='audio'||k==='video'||k==='image';
  if(ws.id==='compress')return !!k;
  const t=toolDef();return !!t&&t.accept.includes(k);
}
function findJob(id){
  for(const k in WS){const ws=WS[k];const j=ws.jobs.find(x=>x.id===id);if(j)return j;if(ws.combo&&ws.combo.id===id)return ws.combo}
  return null;
}

/* ───────── Ejecución de cada tarea ───────── */
const sameExt=(f,ext)=>extOf(f.name)===ext;
const EXEC={
  async convert(job,S){
    const out=job.opts.out,F=FORMATS[out],q=QUALITY[S.quality],base=baseName(job.file.name);
    const name=base+(sameExt(job.file,F.ext)?'-convertido':'')+'.'+F.ext;
    if(job.kind==='image'){
      const blob=await renderImage(job.file,{mime:F.mime,quality:q.img});
      return [{name,blob}];
    }
    const aOut=F.kind==='audio';
    const args=['-i','$0'].concat(aOut?['-vn']:['-sn','-dn'],aOut?audioArgs(out,q.ab):videoArgs(out,q),['$out']);
    const blob=await runFF(job,{files:[job.file],args,outExt:F.ext,mime:F.mime});
    return [{name,blob}];
  },
  async compress(job,S){
    const L=LEVELS[S.level],base=baseName(job.file.name);
    const target=parseFloat(String(S.targetMB).replace(',','.'));
    const useTarget=isFinite(target)&&target>0&&(job.kind==='audio'||job.kind==='video');
    if(useTarget&&!isFinite(job.duration))throw new Error('No se pudo leer la duración de este archivo, así que no se puede calcular el tamaño objetivo. Borra ese valor y usa un nivel.');
    if(job.kind==='image'){
      const F=FORMATS[S.imageOut];
      const blob=await renderImage(job.file,{mime:F.mime,quality:L.imgQ,maxDim:L.imgMax});
      return [{name:base+'-comprimido.'+F.ext,blob}];
    }
    if(job.kind==='pdf'){
      const blob=await pdfCompress(job,L);
      return [{name:base+'-comprimido.pdf',blob}];
    }
    if(job.kind==='audio'){
      const F=FORMATS[S.audioOut];
      let ab=L.ab;
      if(useTarget)ab=clamp(Math.floor(target*1024*1024*8/job.duration/1000*.96),16,320);
      const args=['-i','$0','-vn'].concat(audioArgs(S.audioOut,ab),(L.mono&&!useTarget)?['-ac','1']:[],['$out']);
      const blob=await runFF(job,{files:[job.file],args,outExt:F.ext,mime:F.mime});
      return [{name:base+'-comprimido.'+F.ext,blob}];
    }
    // vídeo
    let rate,box=L.box;
    if(useTarget){
      const total=target*1024*1024*8/job.duration/1000*.94;
      const vab=64;
      const vb=Math.max(80,Math.floor(total-vab));
      box=vb<350?640:vb<900?854:vb<2500?1280:1920;
      rate=['-b:v',vb+'k','-maxrate',Math.floor(vb*1.4)+'k','-bufsize',(vb*2)+'k'];
      job.note=vb<=80?'Con ese tamaño la calidad será muy baja.':'';
    }else rate=['-crf',String(L.crf)];
    const vf='scale=min('+box+'\\,iw):min('+box+'\\,ih):force_original_aspect_ratio=decrease:force_divisible_by=2';
    const args=['-i','$0','-sn','-dn','-vf',vf,'-c:v','libx264','-preset','veryfast'].concat(rate,['-pix_fmt','yuv420p','-c:a','aac','-b:a',(useTarget?64:L.vab)+'k','-ac','2','-movflags','+faststart','$out']);
    const blob=await runFF(job,{files:[job.file],args,outExt:'mp4',mime:'video/mp4'});
    return [{name:base+'-comprimido.mp4',blob}];
  },
  async trim(job,S){
    const a=parseTime(S.trimFrom),b=parseTime(S.trimTo);
    if(isNaN(a)||isNaN(b))throw new Error('Escribe el tiempo como 1:30 o en segundos (por ejemplo 90).');
    const from=a||0;
    if(b!==null&&b<=from)throw new Error('El final tiene que ser mayor que el inicio.');
    if(isFinite(job.duration)&&from>=job.duration)throw new Error('El inicio está después del final del archivo ('+fmtTime(job.duration)+').');
    const ext=extOf(job.file.name)||'mp4';
    const args=['-ss',String(from)].concat(b!==null?['-to',String(b)]:[],['-i','$0','-c','copy','-avoid_negative_ts','make_zero','$out']);
    const blob=await runFF(job,{files:[job.file],args,outExt:ext,mime:job.file.type||'application/octet-stream'});
    return [{name:baseName(job.file.name)+'-recortado.'+ext,blob}];
  },
  async mute(job){
    const ext=extOf(job.file.name)||'mp4';
    const blob=await runFF(job,{files:[job.file],args:['-i','$0','-an','-c:v','copy','$out'],outExt:ext,mime:job.file.type||'video/mp4'});
    return [{name:baseName(job.file.name)+'-sin-audio.'+ext,blob}];
  },
  async normalize(job){
    const af=['-af','loudnorm=I=-16:TP=-1.5:LRA=11'];
    if(job.kind==='audio'){
      const blob=await runFF(job,{files:[job.file],args:['-i','$0','-vn'].concat(af,audioArgs('mp3',192),['$out']),outExt:'mp3',mime:'audio/mpeg'});
      return [{name:baseName(job.file.name)+'-volumen-igualado.mp3',blob}];
    }
    const e=extOf(job.file.name);const ext=['mp4','mov','mkv','m4v'].includes(e)?e:'mkv';
    const blob=await runFF(job,{files:[job.file],args:['-i','$0','-c:v','copy'].concat(af,['-c:a','aac','-b:a','192k','$out']),outExt:ext,mime:'video/'+(ext==='mkv'?'x-matroska':'mp4')});
    return [{name:baseName(job.file.name)+'-volumen-igualado.'+ext,blob}];
  },
  async pdfsplit(job,S){
    await needPdfLib();
    const src=await loadPdfDoc(job.file),n=src.getPageCount(),base=baseName(job.file.name);
    if(S.splitMode==='each'){
      const res=[];
      for(let i=0;i<n;i++){
        if(job.cancelled)throw new Error('cancelado');
        const d=await PDFLib.PDFDocument.create();
        const [p]=await d.copyPages(src,[i]);d.addPage(p);
        const bytes=await d.save();
        res.push({name:base+'-pagina-'+String(i+1).padStart(String(n).length,'0')+'.pdf',blob:new Blob([bytes],{type:'application/pdf'})});
        setProgress(job,(i+1)/n);
      }
      return res;
    }
    const idx=parseRange(S.range,n);
    const d=await PDFLib.PDFDocument.create();
    const pages=await d.copyPages(src,idx);pages.forEach(p=>d.addPage(p));
    const bytes=await d.save();
    return [{name:base+'-paginas.pdf',blob:new Blob([bytes],{type:'application/pdf'})}];
  },
  async pdfmerge(job,S,files){
    await needPdfLib();
    const d=await PDFLib.PDFDocument.create();
    for(let i=0;i<files.length;i++){
      if(job.cancelled)throw new Error('cancelado');
      const src=await loadPdfDoc(files[i]);
      const pages=await d.copyPages(src,src.getPageIndices());
      pages.forEach(p=>d.addPage(p));
      setProgress(job,(i+1)/files.length);
    }
    const bytes=await d.save();
    return [{name:'PDFs-unidos.pdf',blob:new Blob([bytes],{type:'application/pdf'})}];
  },
  async img2pdf(job,S,files){
    await needPdfLib();
    const d=await PDFLib.PDFDocument.create();
    for(let i=0;i<files.length;i++){
      if(job.cancelled)throw new Error('cancelado');
      const f=files[i];
      let img;
      const isJpg=/jpe?g$/i.test(extOf(f.name))||f.type==='image/jpeg';
      const isPng=extOf(f.name)==='png'||f.type==='image/png';
      if(!S.shrink&&isJpg)img=await d.embedJpg(new Uint8Array(await f.arrayBuffer()));
      else if(!S.shrink&&isPng)img=await d.embedPng(new Uint8Array(await f.arrayBuffer()));
      else{
        const blob=await renderImage(f,{mime:'image/jpeg',quality:.85,maxDim:2600});
        img=await d.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      }
      const iw=img.width,ih=img.height;
      if(S.pageMode==='fit'){
        const k=.75,p=d.addPage([iw*k,ih*k]);
        p.drawImage(img,{x:0,y:0,width:iw*k,height:ih*k});
      }else{
        const land=iw>ih,PW=land?841.89:595.28,PH=land?595.28:841.89,M=28;
        const k=Math.min((PW-2*M)/iw,(PH-2*M)/ih),w=iw*k,h=ih*k;
        const p=d.addPage([PW,PH]);
        p.drawImage(img,{x:(PW-w)/2,y:(PH-h)/2,width:w,height:h});
      }
      setProgress(job,(i+1)/files.length);
      await new Promise(r=>setTimeout(r,0));
    }
    const bytes=await d.save();
    return [{name:'Imagenes.pdf',blob:new Blob([bytes],{type:'application/pdf'})}];
  }
};

let wake=null;
async function acquireWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
window.addEventListener('beforeunload',e=>{if(Object.values(WS).some(w=>w.busy)){e.preventDefault();e.returnValue=''}});

function friendly(e){
  const m=(e&&e.message)||String(e);
  if(/memory|allocation|RangeError|Aborted\(/i.test(m)&&!/No se pudo/.test(m))return 'El archivo es demasiado grande para la memoria de este dispositivo. Prueba con uno más pequeño o desde un ordenador.';
  return m;
}
async function runWS(ws){
  if(ws.busy)return;
  const tool=toolDef();
  ws.busy=true;ws.stop=false;renderActions();acquireWake();
  try{
    if(ws.id==='tool'&&tool&&tool.combine){
      const files=ws.jobs.map(j=>j.file);
      const job=ws.combo={id:'c'+(++uid),kind:'pdf',file:null,inSize:files.reduce((s,f)=>s+f.size,0),status:'waiting',results:[],progress:0};
      renderJobs();
      await runOne(ws,job,files);
    }else{
      const list=ws.jobs.filter(j=>j.status==='waiting'||j.status==='error');
      for(const job of list){if(ws.stop)break;await runOne(ws,job)}
    }
  }finally{ws.busy=false;ws.stop=false;releaseWake();renderActions()}
}
async function runOne(ws,job,files){
  job.status='working';job.progress=0;job.error=null;job.cancelled=false;job.note='';
  patchJob(job);
  const key=ws.id==='tool'?state.tool:ws.id;
  try{
    const res=await EXEC[key](job,{...ws.settings},files);
    job.results=res.map(r=>({...r,size:r.blob.size}));
    job.status='done';
  }catch(e){
    if(job.cancelled){job.status='waiting'}
    else{console.error(e);job.status='error';job.error=friendly(e)}
  }
  patchJob(job);renderActions();
}
function cancelJob(job){
  job.cancelled=true;
  if(currentJob===job)cancelFF();
  const ws=curWS();
  if(ws.jobs.length>1&&!ws.combo)ws.stop=true;
}
function setProgress(job,p){
  job.progress=p;
  const el=document.getElementById('js-'+job.id);
  if(!el)return;
  const b=el.querySelector('.bar i'),t=el.querySelector('.pct');
  if(b)b.style.width=(p*100).toFixed(1)+'%';
  if(t)t.textContent=Math.round(p*100)+' %';
}

/* ───────── Descargas ───────── */
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);
}
function allResults(ws){
  const out=[];
  if(ws.combo&&ws.combo.status==='done')out.push(...ws.combo.results);
  else if(!ws.combo)ws.jobs.forEach(j=>{if(j.status==='done')out.push(...j.results)});
  return out;
}
async function downloadZip(ws){
  try{
    await needZip();
    const zip=new JSZip(),seen={};
    for(const r of allResults(ws)){
      let n=r.name;
      if(seen[n]){const i=n.lastIndexOf('.');n=n.slice(0,i)+'-'+(++seen[r.name])+n.slice(i)}else seen[n]=1;
      zip.file(n,r.blob);
    }
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    saveBlob(blob,'Transmuta-archivos.zip');
  }catch(e){toast(friendly(e))}
}

    const job={id:'j'+(++uid),file:f,kind,inSize:f.size,status:'waiting',progress:0,results:[],opts:{out:DEFAULT_OUT[kind]},duration:NaN,note:''};
    ws.jobs.push(job);
    if(kind==='audio'||kind==='video')getDuration(f,kind).then(d=>{job.duration=d;if(isFinite(d)&&curWS().jobs.includes(job))renderJobs()});
  }
  ws.combo=null;
  if(skipped.length)toast(skipped.length===1?'«'+skipped[0]+'» no se puede usar aquí.':skipped.length+' archivos no se pueden usar en esta herramienta.');
  renderJobs();renderActions();
}
function bindDrop(){
  const d=$('#drop'),inp=$('#fileInput');
  if(!d||!inp)return;
  inp.addEventListener('change',()=>{addFiles(inp.files);inp.value=''});
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
}
// Evitar que soltar un archivo fuera de la zona abra el archivo en el navegador
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('#drop'))e.preventDefault()}));

/* ───────── Eventos ───────── */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,ws=curWS();
  switch(act){
    case 'tab':
      if(state.tab===t.dataset.v)return;
      state.tab=t.dataset.v;renderTabs();renderPanel();break;
    case 'tool':
      state.tool=t.dataset.v;WS.tool.jobs=[];WS.tool.combo=null;renderPanel();break;
    case 'toolsback':
      if(WS.tool.busy)return;
      state.tool=null;WS.tool.jobs=[];WS.tool.combo=null;renderPanel();break;
    case 'set':{
      ws.settings[t.dataset.key]=t.dataset.v;
      t.parentElement.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));
      break}
    case 'bulk':
      ws.jobs.forEach(j=>{if(j.kind===t.dataset.k&&allowedOut(j.kind).includes(t.dataset.v)&&j.status!=='working'){j.opts.out=t.dataset.v;if(j.status==='done'||j.status==='error')j.status='waiting'}});
      renderJobs();renderActions();break;
    case 'rm':{
      if(ws.busy)return;
      ws.jobs=ws.jobs.filter(j=>j.id!==t.dataset.id);ws.combo=null;renderJobs();renderActions();break}
    case 'mv':{
      if(ws.busy)return;
      const i=ws.jobs.findIndex(j=>j.id===t.dataset.id),k=i+(+t.dataset.d);
      if(i<0||k<0||k>=ws.jobs.length)return;
      [ws.jobs[i],ws.jobs[k]]=[ws.jobs[k],ws.jobs[i]];ws.combo=null;renderJobs();renderActions();break}
    case 'run':
      runWS(ws).catch(err=>toast(friendly(err)));break;
    case 'stopall':
      ws.stop=true;ws.jobs.concat(ws.combo?[ws.combo]:[]).forEach(j=>{if(j.status==='working')cancelJob(j)});break;
    case 'cancel':{
      const j=findJob(t.dataset.id);if(j)cancelJob(j);break}
    case 'clear':
      if(ws.busy)return;
      ws.jobs=[];ws.combo=null;renderJobs();renderActions();break;
    case 'dl':{
      const j=findJob(t.dataset.id);if(!j)return;
      const r=j.results[+t.dataset.i];if(r)saveBlob(r.blob,r.name);break}
    case 'zip':
      downloadZip(ws);break;
  }
});
function onField(e){
  const t=e.target,ws=curWS();
  if(t.dataset&&t.dataset.set){
    ws.settings[t.dataset.set]=t.type==='checkbox'?t.checked:t.value;
    if(t.dataset.set==='splitMode')toggleRange();
    return;
  }
  if(t.dataset&&t.dataset.job&&e.type==='change'){
    const j=ws.jobs.find(x=>x.id===t.dataset.job);
    if(j){j.opts.out=t.value;if(j.status==='done'||j.status==='error')j.status='waiting';renderJobs();renderActions()}
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

renderTabs();renderPanel();
})();
</script>
